global:
  scrape_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: 'frr'
    static_configs:
      - targets:
        - clab-network-lab-r11:9342
        - clab-network-lab-r12:9342
        - clab-network-lab-r13:9342
        - clab-network-lab-r21:9342
        - clab-network-lab-r22:9342
        - clab-network-lab-r31:9342

  - job_name: 'node'
    static_configs:
      - targets:
        - clab-network-lab-r11:9100
        - clab-network-lab-r12:9100
        - clab-network-lab-r13:9100
        - clab-network-lab-r21:9100
        - clab-network-lab-r22:9100
        - clab-network-lab-r31:9100
