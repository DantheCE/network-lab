global:
  scrape_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: 'frr'
    static_configs:
      - targets:
        - clab-network-lab-r11-frr-exporter:9342
        - clab-network-lab-r12-frr-exporter:9342
        - clab-network-lab-r13-frr-exporter:9342
        - clab-network-lab-r21-frr-exporter:9342
        - clab-network-lab-r22-frr-exporter:9342
        - clab-network-lab-r31-frr-exporter:9342

  - job_name: 'node'
    static_configs:
      - targets:
        - clab-network-lab-r11-node-exporter:9100
        - clab-network-lab-r12-node-exporter:9100
        - clab-network-lab-r13-node-exporter:9100
        - clab-network-lab-r21-node-exporter:9100
        - clab-network-lab-r22-node-exporter:9100
        - clab-network-lab-r31-node-exporter:9100
