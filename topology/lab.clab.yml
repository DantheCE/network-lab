name: network-lab
mgmt:
  network: clab
  ipv4-subnet: 172.30.30.0/24
topology:
  nodes:
    r11:
      kind: linux
      image: quay.io/frrouting/frr:10.0.1
      binds:
      - ./configs/r11/daemons:/etc/frr/daemons
      - ./configs/r11/frr.conf:/etc/frr/frr.conf
      - /tmp/clab_run_r11:/var/run/frr
    r11-frr-exporter:
      kind: linux
      image: tynany/frr_exporter:latest
      network-mode: container:r11
      binds:
      - /tmp/clab_run_r11:/var/run/frr
    r11-node-exporter:
      kind: linux
      image: prom/node-exporter:latest
      network-mode: container:r11
    r12:
      kind: linux
      image: quay.io/frrouting/frr:10.0.1
      binds:
      - ./configs/r12/daemons:/etc/frr/daemons
      - ./configs/r12/frr.conf:/etc/frr/frr.conf
      - /tmp/clab_run_r12:/var/run/frr
    r12-frr-exporter:
      kind: linux
      image: tynany/frr_exporter:latest
      network-mode: container:r12
      binds:
      - /tmp/clab_run_r12:/var/run/frr
    r12-node-exporter:
      kind: linux
      image: prom/node-exporter:latest
      network-mode: container:r12
    r13:
      kind: linux
      image: quay.io/frrouting/frr:10.0.1
      binds:
      - ./configs/r13/daemons:/etc/frr/daemons
      - ./configs/r13/frr.conf:/etc/frr/frr.conf
      - /tmp/clab_run_r13:/var/run/frr
    r13-frr-exporter:
      kind: linux
      image: tynany/frr_exporter:latest
      network-mode: container:r13
      binds:
      - /tmp/clab_run_r13:/var/run/frr
    r13-node-exporter:
      kind: linux
      image: prom/node-exporter:latest
      network-mode: container:r13
    r21:
      kind: linux
      image: quay.io/frrouting/frr:10.0.1
      binds:
      - ./configs/r21/daemons:/etc/frr/daemons
      - ./configs/r21/frr.conf:/etc/frr/frr.conf
      - /tmp/clab_run_r21:/var/run/frr
    r21-frr-exporter:
      kind: linux
      image: tynany/frr_exporter:latest
      network-mode: container:r21
      binds:
      - /tmp/clab_run_r21:/var/run/frr
    r21-node-exporter:
      kind: linux
      image: prom/node-exporter:latest
      network-mode: container:r21
    r22:
      kind: linux
      image: quay.io/frrouting/frr:10.0.1
      binds:
      - ./configs/r22/daemons:/etc/frr/daemons
      - ./configs/r22/frr.conf:/etc/frr/frr.conf
      - /tmp/clab_run_r22:/var/run/frr
    r22-frr-exporter:
      kind: linux
      image: tynany/frr_exporter:latest
      network-mode: container:r22
      binds:
      - /tmp/clab_run_r22:/var/run/frr
    r22-node-exporter:
      kind: linux
      image: prom/node-exporter:latest
      network-mode: container:r22
    r31:
      kind: linux
      image: quay.io/frrouting/frr:10.0.1
      binds:
      - ./configs/r31/daemons:/etc/frr/daemons
      - ./configs/r31/frr.conf:/etc/frr/frr.conf
      - /tmp/clab_run_r31:/var/run/frr
    r31-frr-exporter:
      kind: linux
      image: tynany/frr_exporter:latest
      network-mode: container:r31
      binds:
      - /tmp/clab_run_r31:/var/run/frr
    r31-node-exporter:
      kind: linux
      image: prom/node-exporter:latest
      network-mode: container:r31
    h1:
      kind: linux
      image: wbitt/network-multitool:alpine-extra
    h2:
      kind: linux
      image: wbitt/network-multitool:alpine-extra
  links:
  - endpoints:
    - r11:eth1
    - r12:eth1
  - endpoints:
    - r12:eth2
    - r13:eth1
  - endpoints:
    - r13:eth2
    - r11:eth2
  - endpoints:
    - r21:eth1
    - r22:eth1
  - endpoints:
    - r11:eth3
    - r21:eth2
  - endpoints:
    - r12:eth3
    - r22:eth2
  - endpoints:
    - r13:eth3
    - r31:eth1
  - endpoints:
    - r11:eth4
    - h1:eth1
  - endpoints:
    - r31:eth2
    - h2:eth1
