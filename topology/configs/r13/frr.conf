frr version 10.0.1
frr defaults traditional
hostname r13
!
interface lo
 ip address 10.255.0.13/32

 ip router isis 1
 isis passive

!

interface eth1
 ip address 10.0.0.3/31

 ip router isis 1
 isis network point-to-point

!

interface eth2
 ip address 10.0.0.4/31

 ip router isis 1
 isis network point-to-point

!

interface eth3
 ip address 10.0.0.12/31

!


router isis 1
 net 49.0001.0102.5500.0013.00
 is-type level-2-only
!



ip prefix-list ALLOWED_PREFIXES permit 10.10.0.0/16 le 24

!

router bgp 65001
 bgp router-id 10.255.0.13
 no bgp ebgp-requires-policy


 ! iBGP

 neighbor 10.255.0.11 remote-as 65001
 neighbor 10.255.0.11 update-source lo

 neighbor 10.255.0.12 remote-as 65001
 neighbor 10.255.0.12 update-source lo



 ! eBGP

 neighbor 10.0.0.13 remote-as 65003
 neighbor 10.0.0.13 route-map RM_IN_10.0.0.13 in
 neighbor 10.0.0.13 route-map RM_OUT_10.0.0.13 out
 neighbor 10.0.0.13 maximum-prefix 100


!


route-map RM_IN_10.0.0.13 permit 10
 match ip address prefix-list ALLOWED_PREFIXES
 set local-preference 150
!
route-map RM_OUT_10.0.0.13 permit 10
 match ip address prefix-list ALLOWED_PREFIXES
 set community 65001:1
!

