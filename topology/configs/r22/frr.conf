frr version 10.0.1
frr defaults traditional
hostname r22
!
interface lo
 ip address 10.255.0.22/32
 ip router isis 1
 isis passive
!
interface eth1
 ip address 10.0.0.7/31
 ip router isis 1
 isis network point-to-point
!
!
router isis 1
 net 49.0002.0102.5500.0022.00
 is-type level-2-only
!
router bgp 65002
 bgp router-id 10.255.0.22
 no bgp ebgp-requires-policy
 neighbor 10.255.0.21 remote-as 65002
 neighbor 10.255.0.21 update-source lo
!
